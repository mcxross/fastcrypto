[package]
name = "fastkrypto_uniffi"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
publish = false

description = "UniFFI exports for fastcrypto"

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
fastcrypto = { path = "../../fastcrypto", features = ["aes"] }
fastcrypto-zkp = { path = "../../fastcrypto-zkp" }
rand = { version = "0.8.5", features = ["std"] }
thiserror = "1.0.38"
uniffi = "0.29.4"
zeroize = "1.5.7"
bip39 = { version = "1.2.0", features = ["rand"] }
hmac = "0.12.1"
aes-gcm = "0.10.3"
ctr = "0.9.2"
sha2 = "0.10.8"
k256 = { version = "0.13.3", features = ["arithmetic"] }
p256 = { version = "0.13.2", features = ["arithmetic"] }
subtle = "2.5.0"
hex = "0.4.3"
sha3 = "0.10.8"
blst = { version = "0.3.13", features = ["no-threads"] }
ark-bls12-381 = { version = "0.4.0", features = ["curve"] }
ark-bn254 = "0.4.0"
ark-ec = "0.4.2"
ark-ff = "0.4.2"
ark-groth16 = "0.4.0"
ark-serialize = "0.4.2"
ark-std = "0.4.0"
# Keep Aptos's consensus-facing batch-encryption types separate from the existing Arkworks 0.4
# backend used by BN254/Groth16. These 0.5 crates resolve through the Aptos Core patch in the
# workspace root.
aptos-ark-bls12-381 = { package = "ark-bls12-381", version = "0.5.0", features = ["curve"] }
aptos-ark-ec = { package = "ark-ec", version = "0.5.0" }
aptos-ark-ff = { package = "ark-ff", version = "0.5.0" }
aptos-ark-serialize = { package = "ark-serialize", version = "0.5.0" }
aptos-ark-std = { package = "ark-std", version = "0.5.0" }
bulletproofs = "4.0.0"
curve25519-dalek-ng = "4.1.1"
merlin = "3.0.0"

[dev-dependencies]
ark-snark = "0.4.0"
